name: Deploy Magnolia detector
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Assemble static app
        run: |
          mkdir -p site/models site/reports
          cp index.html app.js detector-core.js styles.css site/
          cp -R vendor examples site/
          cp models/magnolia_detector.onnx models/model.json site/models/
          cp reports/evaluation.json reports/dataset_audit.json site/reports/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
